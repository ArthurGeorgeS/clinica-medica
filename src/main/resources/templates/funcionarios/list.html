<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Clínica</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h2>Funcionários</h2><a class="btn" href="/funcionarios/novo">+ Novo</a>
<table><tr><th>Nome</th><th>CPF</th><th>Cargo</th><th>Admissão</th><th>Ações</th></tr><tr th:each="i : ${itens}"><td th:text="${i.nome}"></td><td th:text="${i.cpf}"></td><td th:text="${i.cargo}"></td><td th:text="${i.dataAdmissao}"></td><td><a th:href="@{/funcionarios/editar/{id}(id=${i.id})}">Editar</a> | <a th:href="@{/funcionarios/excluir/{id}(id=${i.id})}" onclick="return confirm('Excluir?')">Excluir</a></td></tr></table></main></body></html>
