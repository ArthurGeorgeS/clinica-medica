<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Clínica</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h2>Funcionários - Formulário</h2>
<form th:action="@{/funcionarios/salvar}" th:object="${item}" method="post"><input type="hidden" th:field="*{id}">
<label>Nome</label><input type="text" th:field="*{nome}"><span class="err" th:errors="*{nome}"></span><label>CPF</label><input type="text" th:field="*{cpf}"><span class="err" th:errors="*{cpf}"></span><label>Cargo</label><input type="text" th:field="*{cargo}"><span class="err" th:errors="*{cargo}"></span><label>Admissão</label><input type="date" th:field="*{dataAdmissao}"><span class="err" th:errors="*{dataAdmissao}"></span><label>Telefone</label><input type="text" th:field="*{telefone}"><span class="err" th:errors="*{telefone}"></span><label>E-mail</label><input type="email" th:field="*{email}"><span class="err" th:errors="*{email}"></span><h3>Acesso ao sistema</h3><label>Login</label><input name="login" th:value="${item.usuario?.login}"><label>Senha (preencha para criar/alterar)</label><input type="password" name="senha">
<button class="btn">Salvar</button> <a href="/funcionarios">Cancelar</a></form></main></body></html>
