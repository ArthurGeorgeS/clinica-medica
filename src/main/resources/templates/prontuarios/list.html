<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Clínica</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h2>Prontuários</h2><a class="btn" href="/prontuarios/novo">+ Novo</a>
<table><tr><th>Data</th><th>Paciente</th><th>Médico</th><th>Diagnóstico</th><th>Ações</th></tr><tr th:each="i : ${itens}"><td th:text="${#temporals.format(i.dataRegistro,'dd/MM/yyyy HH:mm')}"></td><td th:text="${i.paciente.nome}"></td><td th:text="${i.medico.nome}"></td><td th:text="${i.diagnostico}"></td><td><a th:href="@{/prontuarios/editar/{id}(id=${i.id})}">Editar</a> | <a th:href="@{/prontuarios/excluir/{id}(id=${i.id})}" onclick="return confirm('Excluir?')">Excluir</a></td></tr></table></main></body></html>
