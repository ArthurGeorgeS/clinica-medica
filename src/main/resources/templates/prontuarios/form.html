<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Clínica</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h2>Prontuários - Formulário</h2>
<form th:action="@{/prontuarios/salvar}" th:object="${item}" method="post"><input type="hidden" th:field="*{id}">
<label>Paciente</label><select th:field="*{paciente}"><option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option></select><label>Médico</label><select th:field="*{medico}"><option th:each="d : ${medicos}" th:value="${d.id}" th:text="${d.nome + ' - ' + d.especialidade}"></option></select><label>Consulta (opcional)</label><select th:field="*{consulta}"><option value="">--</option><option th:each="c : ${consultas}" th:value="${c.id}" th:text="${c.id + ' - ' + c.paciente.nome}"></option></select><input type="hidden" th:field="*{dataRegistro}"><label>Queixa</label><textarea th:field="*{queixa}" rows="3"></textarea><label>Diagnóstico</label><textarea th:field="*{diagnostico}" rows="3"></textarea><label>Prescrição</label><textarea th:field="*{prescricao}" rows="3"></textarea>
<button class="btn">Salvar</button> <a href="/prontuarios">Cancelar</a></form></main></body></html>
