<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Clínica</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h2>Consultas</h2><a class="btn" href="/consultas/novo">+ Novo</a>
<table><tr><th>Data/Hora</th><th>Paciente</th><th>Médico</th><th>Status</th><th>Ações</th></tr><tr th:each="i : ${itens}"><td th:text="${#temporals.format(i.dataHora,'dd/MM/yyyy HH:mm')}"></td><td th:text="${i.paciente.nome}"></td><td th:text="${i.medico.nome}"></td><td th:text="${i.status}"></td><td><a th:href="@{/consultas/editar/{id}(id=${i.id})}">Editar</a> | <a th:href="@{/consultas/excluir/{id}(id=${i.id})}" onclick="return confirm('Excluir?')">Excluir</a></td></tr></table></main></body></html>
