<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Clínica</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main><h2>Consultas - Formulário</h2>
<form th:action="@{/consultas/salvar}" th:object="${item}" method="post"><input type="hidden" th:field="*{id}">
<label>Paciente</label><select th:field="*{paciente}"><option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option></select><label>Médico</label><select th:field="*{medico}"><option th:each="d : ${medicos}" th:value="${d.id}" th:text="${d.nome + ' - ' + d.especialidade}"></option></select><label>Data e hora</label><input type="datetime-local" th:field="*{dataHora}"><span class="err" th:errors="*{dataHora}"></span><label>Status</label><select th:field="*{status}"><option th:each="s : ${T(com.clinica.model.Consulta.Status).values()}" th:value="${s}" th:text="${s}"></option></select><label>Observação</label><input type="text" th:field="*{observacao}"><span class="err" th:errors="*{observacao}"></span>
<button class="btn">Salvar</button> <a href="/consultas">Cancelar</a></form></main></body></html>
